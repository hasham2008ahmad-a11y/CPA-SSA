<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: 'Plus Jakarta Sans', Arial, Helvetica, sans-serif; color: #3D4344; }
  a { color: #002453; }
  a:hover { color: #003DA6; }
</style>
</helmet>
<dc-import name="Header" active-page="Events" hint-size="100%,72px"></dc-import>
<main>
  <div style="max-width:1170px;margin:0 auto;padding:32px 50px 0">
    <div style="fontSize:13px;color:#6F6F6F;marginBottom:16px"><a href="Home.dc.html" style="color:#6F6F6F;textDecoration:none">Home</a> / Events</div>
    <h1 style="color:#003DA6;fontSize:44px;fontWeight:800;letterSpacing:-1px;margin:0 0 12px">Events</h1>
    <p style="fontSize:16px;fontWeight:300;color:#3D4344;maxWidth:640px;margin:0 0 48px;lineHeight:1.6">Case competitions, employer sessions, and socials throughout the year.</p>
  </div>
  <section style="max-width:1170px;margin:0 auto;padding:0 50px 96px">
    <div style="display:grid;gridTemplateColumns:repeat(auto-fit,minmax(300px,1fr));gap:28px">
      <sc-for list="{{events}}" as="item" hint-placeholder-count="6">
        <div style="border:1px solid #D0D7DD;borderRadius:12px;padding:28px;position:relative">
          <div style="height:4px;width:40px;borderRadius:2px;background:{{item.tagColor}};marginBottom:20px"></div>
          <div style="display:flex;justifyContent:space-between;alignItems:flex-start;gap:12px;marginBottom:12px">
            <div style="fontWeight:800;fontSize:19px;color:#002453">{{item.title}}</div>
            <div style="background:#002453;color:#FFFFFF;borderRadius:8px;padding:6px 10px;textAlign:center;fontSize:11px;fontWeight:700;lineHeight:1.3;whiteSpace:nowrap">{{item.date}}</div>
          </div>
          <div style="fontSize:11px;fontWeight:700;color:{{item.tagColor}};textTransform:uppercase;letterSpacing:0.05em;marginBottom:12px">{{item.tag}}</div>
          <div style="fontSize:15px;fontWeight:300;lineHeight:1.6;color:#3D4344;marginBottom:16px">{{item.desc}}</div>
          <a href="#" style="fontWeight:700;fontSize:14px;color:#003DA6;textDecoration:none">Learn More ›</a>
        </div>
      </sc-for>
    </div>
  </section>
</main>
<dc-import name="Footer" hint-size="100%,300px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      events: [
        { title: 'CPA PEP Info Session', date: 'SEP 24', tag: 'Info Session', tagColor: '#003DA6', desc: 'Learn how the CPA PEP pathway works and when to start planning.' },
        { title: 'Resume Workshop', date: 'OCT 08', tag: 'Workshop', tagColor: '#0D7341', desc: 'Get your resume ready ahead of recruiting season with peer reviewers.' },
        { title: 'Meet the Firms Night', date: 'OCT 22', tag: 'Networking', tagColor: '#6D3885', desc: 'Talk to recruiters from public practice, industry, and government.' },
        { title: 'Case Competition', date: 'MAR 14', tag: 'Competition', tagColor: '#A12B4E', desc: 'Our flagship case competition, open to students of all years.' },
        { title: 'Alumni Panel', date: 'MAR 28', tag: 'Panel', tagColor: '#003DA6', desc: 'Hear from CPA Schulich alumni about their career paths.' },
        { title: 'Year-End Social', date: 'APR 03', tag: 'Social', tagColor: '#0D7341', desc: 'Celebrate the end of the year with the whole association.' },
      ],
    };
  }
}

</script>
</body>
</html>
